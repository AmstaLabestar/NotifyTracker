name: Android CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - feature
      - feature/**
  pull_request:

# Autorise le job a creer/mettre a jour une release.
permissions:
  contents: write

# Annule un build precedent encore en cours sur la meme branche.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: sh ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
             "dist/NotifTracker-${{ github.ref_name }}-${{ github.run_number }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk dist/NotifTracker-latest.apk

      # 1) Toujours disponible dans l'onglet Actions du run (toutes branches / PR).
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NotifTracker-apk
          path: dist/*.apk
          retention-days: 30

      # 2) Release "latest" mise a jour a chaque push : lien de telechargement stable.
      #    URL directe :
      #    https://github.com/${{ github.repository }}/releases/download/latest/NotifTracker-latest.apk
      - name: Update rolling "latest" release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Derniere build (${{ github.ref_name }})
          body: |
            APK debug genere automatiquement.
            Branche : `${{ github.ref_name }}`
            Commit : ${{ github.sha }}
            Build : #${{ github.run_number }}
          prerelease: true
          files: dist/*.apk
